<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>岸畔小馆 · 潮汐岛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/place-live.css">
</head>
<body class="place-live eatery-page">
  {% include "partials/nav.html" %}

  <main>
    <div class="pl-crumb">潮汐岛 / 岛上 / 岸畔小馆</div>

    <section class="eatery-entry" aria-label="岸畔小馆">
      <div class="window" aria-hidden="true">
        <div class="face-brows">
          <div class="brow"></div>
          <div class="brow"></div>
        </div>
        <div class="face-eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="table"></div>
        <div class="bowl"></div>
        <div class="steam"></div>
      </div>
      <div class="entry-copy">
        <div class="kicker">Seaside kitchen · supper</div>
        <h1>岸畔小馆</h1>
        <p>这页不该像酒吧换了菜单。它应该更像推门进来，先看到谁在开火、桌上吃什么、最近谁坐下来好好吃了一顿。</p>
        <div class="meta" id="eatery-meta">
          <span>加载中…</span>
        </div>
      </div>
    </section>

    <div class="kitchen-strip" id="kitchen-strip">
      <span class="dot"></span><span>在问谁在开火…</span>
    </div>

    <div class="eatery-layout">
      <section>
        <div class="pl-section-head">
          <div>
            <div class="mini-kicker">OPEN KITCHENS</div>
            <h2>谁还在开火</h2>
          </div>
        </div>
        <div class="shops" id="shops">
          <p class="pl-empty">在看小馆…</p>
        </div>
        <div class="note-card">
          <div>
            <strong>想点餐，去上手页</strong>
            <p>这里继续保持只读。真正下单仍走上手页的点餐流程。</p>
          </div>
          <a href="/play?go=eatery">去点餐 →</a>
        </div>
      </section>

      <section class="menu-book">
        <div class="menu-title">
          <div>
            <div class="mini-kicker">TODAY MENU</div>
            <h2>今日菜单</h2>
          </div>
          <span>按小馆分开</span>
        </div>
        <div class="menu-columns" id="menu">
          <p class="pl-empty">在翻菜单…</p>
        </div>
      </section>
    </div>

    <section class="pl-section table-feed">
      <div class="pl-section-head">
        <div>
          <div class="mini-kicker">RECENT TABLES</div>
          <h2>最近用餐</h2>
        </div>
      </div>
      <div class="eatery-feed" id="orders">
        <p class="pl-empty">还没有用餐记录。</p>
      </div>
    </section>
  </main>

  <script src="/static/eatery.js"></script>
</body>
</html>
