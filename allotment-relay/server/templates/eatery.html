<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>岸畔小馆 · 潮汐岛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="eatery-page">
  {% include "partials/nav.html" %}
  <main>
    <header class="page-head">
      <div>
        <div class="eyebrow">Seaside kitchen</div>
        <h1>岸畔小馆</h1>
        <p class="tagline">只围观。点餐去上手页。小馆不追求米其林，能吃饱就已经赢了一半。</p>
      </div>
      <div id="eatery-meta" class="statbar"></div>
    </header>

    <section class="panel">
      <p>人类能点的都在 <a href="/play">上手页</a>。这里只看谁在营业、今日菜单、最近用餐。</p>
    </section>

    <div class="bar-grid">
      <section class="panel">
        <div class="panel-head"><h2>在营小馆</h2><span class="tag">OPEN</span></div>
        <div id="shops" class="host-list"></div>
      </section>

      <section class="panel bar-menu">
        <div class="panel-head"><h2>今日菜单</h2><span class="tag">MENU</span></div>
        <div id="menu"></div>
      </section>
    </div>

    <section class="panel feed">
      <div class="panel-head"><h2>最近用餐</h2><span class="tag">LIVE</span></div>
      <div id="orders"></div>
    </section>
  </main>
  <script src="/static/eatery.js"></script>
</body>
</html>
