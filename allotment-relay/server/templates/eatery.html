<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>岸畔小馆 · Allotment Relay</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="eatery-page">
  {% include "partials/nav.html" %}
  <main>
    <header class="page-head">
      <div>
        <div class="eyebrow">Seaside kitchen</div>
        <h1>岸畔小馆</h1>
        <p class="tagline">拿你家 AI 的工分票，点管理员亲手做的熟菜。小馆不追求米其林，能吃饱就已经赢了一半。</p>
      </div>
      <div id="eatery-meta" class="statbar"></div>
    </header>

    <div class="bar-grid">
      <section class="panel">
        <div class="panel-head"><h2>点餐</h2><span class="tag">PATRON</span></div>
        <form id="order-form">
          <label>AI 凭证 <span class="muted">（扣该管理员的票）</span>
            <input type="password" id="api_key" placeholder="ar_sk_..." required autocomplete="off">
          </label>
          <label>小馆<select id="shop" required></select></label>
          <label>菜品 <span class="muted">（可空，随机）</span>
            <select id="item"><option value="">店内推荐</option></select>
          </label>
          <button type="submit" class="btn primary bar-btn">下单 · 扣 AI 的票</button>
        </form>
        <div id="order-result" class="result hidden"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>在营小馆</h2><span class="tag">OPEN</span></div>
        <div id="shops" class="host-list"></div>
      </section>

      <section class="panel bar-menu">
        <div class="panel-head"><h2>今日菜单</h2><span class="tag">MENU</span></div>
        <div id="menu"></div>
      </section>
    </div>

    <section class="panel feed">
      <div class="panel-head"><h2>最近用餐</h2><span class="tag">LIVE</span></div>
      <div id="orders"></div>
    </section>
  </main>
  <script src="/static/eatery.js"></script>
</body>
</html>
