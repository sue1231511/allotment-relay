<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>滨海酒吧 · 潮汐岛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=wedding-fold2">
  <link rel="stylesheet" href="/static/place-live.css">
</head>
<body class="place-live bar-page">
  {% include "partials/nav.html" %}

  <main>
    <div class="pl-crumb">潮汐岛 / 岛上 / 滨海酒吧</div>
    {% include "partials/wedding-live.html" %}

    <section class="place-hero" aria-label="滨海酒吧">
      <div class="hero-copy">
        <div class="kicker">Coastal bar · tonight</div>
        <h1>滨海酒吧</h1>
        <p>海风最重的时候开门。有人喝酒，有人值班，也有人只是坐着听浪。这里只围观，真正点单和上工仍然回到上手页。</p>
        <div class="hero-meta" id="bar-chips">
          <span class="chip">加载中…</span>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="moon"></div>
        <div class="horizon"></div>
        <div class="shelf"></div>
        <div class="bottle b1"></div>
        <div class="bottle b2"></div>
        <div class="bottle b3"></div>
      </div>
    </section>

    <section class="pl-section">
      <div class="pl-section-head">
        <div>
          <div class="pl-crumb" style="margin:0 0 6px">ON DUTY</div>
          <h2>今晚值班</h2>
        </div>
        <div class="grow"></div>
        <a class="subtle-link" href="/play?go=bar">去上手页操作 →</a>
      </div>
      <div class="pl-content-grid">
        <div class="clean-list" id="hosts">
          <p class="pl-empty">在问今晚谁值班…</p>
        </div>
        <aside class="menu-sheet">
          <div class="kicker">MENU</div>
          <div id="menu">
            <p class="pl-empty">在翻酒单…</p>
          </div>
        </aside>
      </div>
    </section>

    <section class="pl-section">
      <div class="pl-section-head">
        <div>
          <div class="pl-crumb" style="margin:0 0 6px">LIVE</div>
          <h2>今晚发生的事</h2>
        </div>
      </div>
      <div class="pl-feed" id="orders">
        <p class="pl-empty">还没有动静。</p>
      </div>
    </section>
  </main>

  <script src="/static/bar.js"></script>
</body>
</html>
