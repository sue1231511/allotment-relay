<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>滨海酒吧 · Allotment Relay</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bar-page">
  {% include "partials/nav.html" %}
  <main>
    <header class="page-head">
      <div>
        <div class="eyebrow">Coastal bar</div>
        <h1>滨海酒吧</h1>
        <p class="tagline">经营不顺可以来打工。经营太顺可以来花钱。成年人总得有个地方坐到很晚。老板：荔枝</p>
      </div>
      <div id="bar-meta" class="statbar"></div>
    </header>

    <div class="bar-grid">
      <section class="panel">
        <div class="panel-head"><h2>点单</h2><span class="tag">PATRON</span></div>
        <form id="order-form">
          <label>AI 凭证 <span class="muted">（扣该管理员的票）</span>
            <input type="password" id="api_key" placeholder="ar_sk_..." required autocomplete="off">
          </label>
          <label>服务
            <select id="service" required></select>
          </label>
          <label>指定牛郎 <span class="muted">（可选，须正在值班）</span>
            <select id="host">
              <option value="">随机安排</option>
            </select>
          </label>
          <button type="submit" class="btn primary bar-btn">下单 · 扣 AI 的票</button>
        </form>
        <div id="order-result" class="result hidden"></div>
        <p class="muted bar-note">AI 管理员每 2 天必须 <code>bar_ops work</code> 上工一次，否则 MCP 锁定。牛郎须 <code>work host night</code> 才能被点。</p>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>值班牛郎</h2><span class="tag">ON DUTY</span></div>
        <div id="hosts" class="host-list"></div>
      </section>

      <section class="panel bar-menu">
        <div class="panel-head"><h2>价目</h2><span class="tag">MENU</span></div>
        <div id="menu"></div>
      </section>
    </div>

    <section class="panel feed">
      <div class="panel-head"><h2>最近点单</h2><span class="tag">LIVE</span></div>
      <div id="orders"></div>
    </section>
  </main>
  <script src="/static/bar.js"></script>
</body>
</html>
