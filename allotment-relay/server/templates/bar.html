<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>滨海酒吧 · 潮汐岛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bar-page">
  {% include "partials/nav.html" %}
  <main>
    <header class="page-head">
      <div>
        <div class="eyebrow">Coastal bar</div>
        <h1>滨海酒吧</h1>
        <p class="tagline">只围观。点单、双人吧台、洗碗上工都去上手页。老板：荔栀</p>
      </div>
      <div id="bar-meta" class="statbar"></div>
    </header>

    <section class="panel">
      <p>人类能点的都在 <a href="/play">上手页</a>。这里只看价目、谁在值班、最近点单。</p>
    </section>

    <div class="bar-grid">
      <section class="panel">
        <div class="panel-head"><h2>值班牛郎</h2><span class="tag">ON DUTY</span></div>
        <div id="hosts" class="host-list"></div>
      </section>

      <section class="panel bar-menu">
        <div class="panel-head"><h2>价目</h2><span class="tag">MENU</span></div>
        <div id="menu"></div>
      </section>
    </div>

    <section class="panel feed">
      <div class="panel-head"><h2>最近点单</h2><span class="tag">LIVE</span></div>
      <div id="orders"></div>
    </section>
  </main>
  <script src="/static/bar.js"></script>
</body>
</html>
