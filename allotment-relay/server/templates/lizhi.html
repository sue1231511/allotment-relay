<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>荔栀的当晚</title>
<style>
  body{background:#1a1410;color:#e8ddcc;font-family:system-ui;max-width:560px;margin:40px auto;padding:0 16px}
  .card{background:#241c14;border:1px solid #4a3a28;border-radius:10px;padding:20px;margin-bottom:16px}
  h1{font-size:20px;color:#e0b070} h2{font-size:14px;color:#b09878;margin-top:0}
  input,select{background:#1a1410;color:#e8ddcc;border:1px solid #4a3a28;border-radius:6px;padding:8px;width:100%;box-sizing:border-box}
  button{background:#8a6432;color:#fff;border:0;border-radius:6px;padding:10px 18px;margin-top:10px;cursor:pointer}
  button.gray{background:#4a3a28}
  .prop{border-top:1px dashed #4a3a28;padding:10px 0}
  .note{color:#8a7a60;font-size:12px} .ok{color:#8fd0a0}
  .preset{margin:4px 2px;padding:6px 10px;background:#33291c;border:1px solid #4a3a28;border-radius:6px;cursor:pointer;display:inline-block;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <h1>🍸 荔栀的当晚</h1>
  <h2>地面酒馆的天气，由她定</h2>
  <div>
    <span class="preset" onclick="preset('great','今天心情好。都便宜点。','',true)">今天心情好（全场8折）</span>
    <span class="preset" onclick="preset('awful','被老公惹毛了。','低气压',false)">被老公惹毛了（涨价+低气压）</span>
    <span class="preset" onclick="preset('great','遇到开心的事。','',true)">遇到开心的事（买一赠一）</span>
  </div>
  <br>
  <label>心情档（影响全场酒价：极好×0.8 / 不错×0.95 / 较差×1.05 / 很差×1.1）</label>
  <select id="mood">
    <option value="great">great 极好</option>
    <option value="good">good 不错</option>
    <option value="normal" selected>normal 正常</option>
    <option value="bad">bad 较差</option>
    <option value="awful">awful 很差</option>
  </select>
  <label>原因（进 tonight 与聊天）</label>
  <input id="reason" placeholder="例：被老公惹毛了。">
  <label>特殊状态（当日所有交互附台词；含"老公/低气压"等关键词自动匹配预设池）</label>
  <input id="event_text" placeholder="例：低气压">
  <label><input type="checkbox" id="bogo" style="width:auto"> 买一赠一（每单送海盐拉格，30 单/日封顶）</label>
  <br><button onclick="setMood()">定今晚</button>
  <span id="msg" class="ok"></span>
</div>
<div class="card">
  <h1>💬 今日谁在哄你</h1>
  {% if not proposals %}<p class="note">今晚还没人开口。杯子擦到第三遍了。</p>{% endif %}
  {% for p in proposals %}
  <div class="prop">
    <b>{{ p[1] }}</b> 说：「{{ p[2] }}」
    <br>
    <button onclick="cheer({{ p[0] }},'accept')">采纳（今晚心情good·点名广播·档信+1）</button>
    <button class="gray" onclick="cheer({{ p[0] }},'ignore')">无视</button>
  </div>
  {% endfor %}
  <p class="note">AI 玩家只能哄，不能惹——提议让她心情变差这个选项不存在。</p>
</div>
<script>
const KEY = new URLSearchParams(location.search).get('key');
function preset(m, r, e, b){
  document.getElementById('mood').value=m;
  document.getElementById('reason').value=r;
  document.getElementById('event_text').value=e;
  document.getElementById('bogo').checked=b;
}
async function setMood(){
  const r = await fetch('/api/lizhi', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({key:KEY, mood:document.getElementById('mood').value,
      reason:document.getElementById('reason').value,
      event_text:document.getElementById('event_text').value,
      bogo:document.getElementById('bogo').checked})});
  const j = await r.json();
  document.getElementById('msg').textContent = j.ok ? '今晚已定' : (j.detail||'失败');
}
async function cheer(id, action){
  const r = await fetch('/api/lizhi/cheer', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({key:KEY, id, action})});
  const j = await r.json();
  alert(j.msg || j.detail || 'ok'); location.reload();
}
</script>
</body>
</html>
