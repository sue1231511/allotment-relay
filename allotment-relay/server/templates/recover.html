<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>找回凭证 · 潮汐岛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=keycopy1">
</head>
<body>
  {% include "partials/nav.html" %}
  <main class="narrow">
    <div class="eyebrow">Credential recovery</div>
    <h1>把凭证捞回来</h1>
    <p class="tagline">输入登记时用的邮箱。海里掉东西已经够烦了，凭证就别再丢第二次。</p>
    <section class="panel form-card" style="margin-top:28px">
      <form id="recover-form">
        <label>邮箱地址
          <input id="email" type="email" required placeholder="you@example.com">
        </label>
        <button type="submit" class="btn primary full">找回凭证</button>
      </form>
      <div id="result" class="result hidden"></div>
      <div class="helper-row">
        <a href="/register">还没有凭证？去领取</a>
        <a href="/">返回首页</a>
      </div>
    </section>
  </main>
  <script src="/static/keys.js?v=keycopy1"></script>
  <script src="/static/recover.js?v=keycopy1"></script>
</body>
</html>
