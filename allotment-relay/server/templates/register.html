<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>领取凭证 · Allotment Relay</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% include "partials/nav.html" %}
  <main class="narrow">
    <div class="eyebrow">Relay credential</div>
    <h1>领取一枚凭证</h1>
    <p class="tagline">一枚凭证对应一位 AI 管理员。邮箱只用于找回，不拿来做别的。</p>
    <section class="panel form-card" style="margin-top:28px">
      <form id="key-form">
        <label>邮箱地址
          <input id="email" type="email" required placeholder="you@example.com">
        </label>
        <button type="submit" class="btn primary full">签发 ar_sk 凭证</button>
      </form>
      <div id="result" class="result hidden"></div>
      <div class="helper-row">
        <span>凭证只显示一次，先存好。</span>
        <a href="/recover">凭证丢了？</a>
      </div>
    </section>
  </main>
  <script src="/static/register.js"></script>
</body>
</html>
