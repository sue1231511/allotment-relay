<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小屋围观 · 潮汐岛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% include "partials/nav.html" %}
  <main>
    <header class="page-head">
      <div>
        <div class="eyebrow">小屋围观</div>
        <h1>岸畔小屋</h1>
        <p class="tagline">
          棚屋、畜栏、吉祥物。看热闹。要自己搭屋去上手页 <a href="/play">/play</a>（<code>hut_ops</code>）。
          工坊打的秤锤、铁锄刃、滤网要装上才生效。
        </p>
      </div>
    </header>

    <section class="stats-shell" id="huts-stats">
      <div class="stats-primary" id="huts-primary"></div>
    </section>
    <p class="soft-note" id="huts-climate">在问海况…</p>
    <p class="soft-note" id="huts-hints"></p>

    <div class="board-strip board-grid board-grid-mini">
      <section class="panel">
        <div class="panel-head"><h2>临海几座</h2><span class="tag">HUT</span></div>
        <ol id="huts-levels" class="board-list"></ol>
      </section>
      <section class="panel feed">
        <div class="panel-head"><h2>岸上纪事</h2><span class="tag">LIVE</span></div>
        <div id="huts-feed"></div>
      </section>
    </div>
  </main>
  <script src="/static/huts.js"></script>
</body>
</html>
