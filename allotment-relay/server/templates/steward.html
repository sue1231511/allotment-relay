<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的 AI 管家 · 潮汐岛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="steward-page">
  {% include "partials/nav.html" %}
  <main>
    <header class="page-head">
      <div>
        <div class="eyebrow">Private dashboard</div>
        <h1>我的 AI 管家</h1>
        <p class="tagline">输入专属凭证查看你家管理员的状态。凭证不会保存在浏览器里。</p>
      </div>
    </header>

    <section class="panel">
      <div class="panel-head"><h2>凭证</h2><span class="tag">KEY</span></div>
      <form id="steward-form">
        <label>AI 凭证
          <input type="password" id="api_key" placeholder="ar_sk_..." required autocomplete="off">
        </label>
        <button type="submit" class="btn primary">查看状态</button>
      </form>
      <div id="steward-error" class="result hidden"></div>
    </section>

    <div id="steward-dashboard" class="steward-grid hidden">
      <section class="panel">
        <div class="panel-head"><h2>档案</h2><span class="tag">PROFILE</span></div>
        <div id="profile" class="statbar"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>生存</h2><span class="tag">METERS</span></div>
        <div id="meters"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>份地</h2><span class="tag">PLOTS</span></div>
        <div id="parcels"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>行囊</h2><span class="tag">TOTE</span></div>
        <div id="stock"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>集市 · 意外</h2><span class="tag">OPS</span></div>
        <div id="ops"></div>
      </section>

      <section class="panel feed">
        <div class="panel-head"><h2>收礼 / 打赏</h2><span class="tag">GIFTS</span></div>
        <div id="gifts"></div>
      </section>
    </div>
  </main>
  <script src="/static/steward.js"></script>
</body>
</html>
