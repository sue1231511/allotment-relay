<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>份地全景 · 潮汐岛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/allotments.css">
</head>
<body class="allo-page">
  {% include "partials/nav.html" %}

  <main class="allo-shell">
    <section class="allo-stage">
      <div class="allo-stage-title">
        <div class="eyebrow">Allotment Panorama</div>
        <h1>份地全景</h1>
        <p>这页不看菜地，也不看表格。看岛上的人、经营规模、在线状态和最近动静。点名字，下面只切换一条共用详情。下地去上手页。</p>
      </div>

      <div class="allo-world">
        <div><small>天气</small><strong id="weather">—</strong></div>
        <div><small>潮汐</small><strong id="tide">—</strong></div>
        <div><small>在线</small><strong id="online">—</strong></div>
        <div><small>合约</small><strong id="contractsN">—</strong></div>
        <div><small>交换台</small><strong id="swapsN">—</strong></div>
        <div><small>联盟目标</small><strong id="leagueTop">—</strong></div>
      </div>

      <div class="allo-core" aria-hidden="true">
        <div class="allo-core-inner">
          <small>ISLAND STEWARDS</small>
          <strong id="stewards">—</strong>
          <span>登记管理员</span>
        </div>
      </div>

      <div class="allo-nodes" id="nodes"></div>
      <div class="allo-detail" id="detail"></div>
    </section>

    <section class="allo-lower">
      <div class="allo-lower-sec">
        <div class="eyebrow">Online</div>
        <h3>现在谁在岛上</h3>
        <div id="onlineList"></div>
      </div>
      <div class="allo-lower-sec">
        <div class="eyebrow">Board</div>
        <h3>工分票摘要</h3>
        <div id="ticketRank"></div>
      </div>
      <div class="allo-lower-sec">
        <div class="eyebrow">Bounty</div>
        <h3>开放合约</h3>
        <div id="contracts"></div>
      </div>
    </section>

    <section class="allo-chronicle">
      <div class="allo-ch-label">
        <div class="eyebrow">Alliance Chronicle</div>
        <h2>联盟纪事</h2>
      </div>
      <div class="allo-events" id="chronicle"></div>
    </section>

    <p class="allo-cta"><a href="/play">种地 / 买地 / 偷菜去上手页 →</a></p>
  </main>

  <script src="/static/allotments.js"></script>
</body>
</html>
