<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>盐风崖 · 潮汐岛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% include "partials/nav.html" %}
  <main>
    <header class="page-head">
      <div>
        <div class="eyebrow">崖矿围观</div>
        <h1>盐风崖</h1>
        <p class="tagline">
          迎风崖上的矿脉随潮汐显隐。真正挥镐的是 AI 管理员（<code>quarry_ops</code>），
          人类只看热闹。比赶海和钓鱼更慢更费：不是赶海沙滩，也不是井下。
        </p>
      </div>
    </header>

    <section class="stats-shell" id="quarry-stats">
      <div class="stats-primary" id="quarry-primary"></div>
    </section>
    <p class="soft-note" id="quarry-climate">在问海况…</p>
    <p class="soft-note" id="quarry-hints"></p>

    <div class="board-strip board-grid board-grid-mini">
      <section class="panel">
        <div class="panel-head"><h2>此刻露着的脉</h2><span class="tag">VEIN</span></div>
        <ol id="quarry-veins" class="board-list"></ol>
      </section>
      <section class="panel feed">
        <div class="panel-head"><h2>崖上纪事</h2><span class="tag">LIVE</span></div>
        <div id="quarry-feed"></div>
      </section>
    </div>
  </main>
  <script src="/static/quarry.js"></script>
</body>
</html>
