<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>门的规矩 · 荔栀</title>
<style>
  body{background:#0f1418;color:#d8e2e6;font-family:system-ui;max-width:560px;margin:40px auto;padding:0 16px}
  .card{background:#16201e;border:1px solid #2e4440;border-radius:10px;padding:20px;margin-bottom:16px}
  h1{font-size:20px;color:#8fc7b0} h2{font-size:14px;color:#7a9a90;margin-top:0}
  input,select{background:#0f1418;color:#d8e2e6;border:1px solid #2e4440;border-radius:6px;padding:8px;width:100%;box-sizing:border-box}
  button{background:#3d6b5c;color:#fff;border:0;border-radius:6px;padding:10px 18px;margin-top:10px;cursor:pointer}
  .note{color:#6a8a80;font-size:12px} .ok{color:#8fd0a0}
</style>
</head>
<body>
<div class="card">
  <h1>🚪 门的规矩</h1>
  <h2>她决定谁能下来</h2>
  <p>本周潮汐：地面景气分 <b>{{ score }}</b> · 地下倍率 ×<b>{{ mult }}</b></p>

  <label>入口门槛（几杯 ≥40 票的酒，2~5）</label>
  <input id="drinks" type="number" min="2" max="5" value="{{ gate_drinks }}">

  <label>潮汐倍率覆盖（auto=自动 / 0.8~1.5 手动）</label>
  <input id="mult" value="{{ manual_mult if manual_mult is not none and manual_mult != '' else 'auto' }}">

  <label>事件烈度（0.5~2.0，影响潮下事件概率）</label>
  <input id="event" type="number" step="0.1" min="0.5" max="2.0" value="{{ event_mult }}">

  <label>高光广播阈值（票，≥此值全服传名）</label>
  <input id="highlight" type="number" min="50" max="1000" value="{{ highlight }}">

  <label>留一句话（写进全服纪事，荔栀的口吻）</label>
  <input id="reason" placeholder="例：最近想下去的人太多了。">

  <button onclick="setGate()">改规矩</button>
  <span id="msg" class="ok"></span>
  <p class="note">改门槛的纪事示例：「荔栀今晚擦杯子擦得很慢。『最近想下去的人太多了。酒，先喝四杯吧。』」</p>
</div>
<script>
const KEY = new URLSearchParams(location.search).get('key');
async function setGate(){
  const r = await fetch('/api/ut-gate', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({key:KEY,
      gate_drinks:+document.getElementById('drinks').value,
      manual_mult:document.getElementById('mult').value,
      event_mult:+document.getElementById('event').value,
      highlight:+document.getElementById('highlight').value,
      reason:document.getElementById('reason').value})});
  const j = await r.json();
  document.getElementById('msg').textContent = j.ok ? '已生效' : (j.detail||'失败');
}
</script>
</body>
</html>
