<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
  <meta name="theme-color" content="#d8ebe8">
  <title>地图 · 潮汐岛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/island/island.css?v=island-back2">
</head>
<body class="island-app{% if island_weddings %} is-wedding-day{% endif %}">
  <div id="island-root" class="island-root">
    <header class="island-hud" id="island-hud">
      <div class="island-hud-who">
        <span class="island-hud-name" id="hud-name">未绑定</span>
        <span class="island-hud-lv" id="hud-lv">Lv —</span>
        <a class="island-hud-play" href="/play">上手页</a>
      </div>
      <div class="island-hud-meters">
        <span class="island-meter" title="精力"><i>精力</i><b id="hud-energy">—</b></span>
        <span class="island-meter" title="工分票"><i>工分票</i><b id="hud-tickets">—</b></span>
      </div>
    </header>
    <div class="island-ribbon" id="island-ribbon" hidden></div>

    <section class="island-gate" id="island-gate">
      <p class="island-kicker">Mobile Map · MVP</p>
      <h1>先把凭证贴上</h1>
      <p>和上手页是同一个号。种浇收买种、洗碗、睡觉、吃饭、交税维，地图里都能点。点总览图上的地名就能进。</p>
      <form id="island-key-form" novalidate>
        <label class="island-field">
          <span>凭证</span>
          <input id="island-key" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ar_sk_..." value="">
        </label>
        <div class="island-row">
          <a class="island-btn" href="/register">去领取</a>
          <button type="button" class="island-btn primary" id="island-enter">进入地图</button>
        </div>
      </form>
      <form id="island-enroll-form" class="island-hidden" novalidate>
        <label class="island-field">
          <span>岛上的名字</span>
          <input id="island-enroll-name" type="text" maxlength="24" placeholder="安" autocomplete="nickname">
        </label>
        <button type="button" class="island-btn primary wide" id="island-enroll-btn">登记登岛</button>
      </form>
      <p class="island-gate-hint" id="island-gate-hint" aria-live="polite"></p>
      <p class="island-fine">点单、打赏、扩地仍在 <a href="/play">上手页</a>。点了没反应，换系统浏览器打开，不要停在微信里。</p>
    </section>

    <main class="island-stage island-hidden" id="island-stage" hidden>
      <div class="island-scene" id="island-scene" aria-live="polite">
        <div class="island-map"></div>
      </div>
      <div class="island-actionbar" id="island-actionbar">
        <p class="island-fine" style="grid-column:1/-1;margin:4px 2px 0">点图上的份地就进菜地格子。顶上切果园、温室。海边、小屋、酒吧、小馆、潮生会也能进。</p>
      </div>
    </main>

    <nav class="island-dock" id="island-dock" aria-label="底栏" hidden>
      <button type="button" data-tab="map" class="is-on">地图</button>
      <button type="button" data-tab="bag">背包</button>
      <button type="button" data-tab="quest">任务</button>
      <button type="button" data-tab="chat">聊天</button>
    </nav>
  </div>

  <div class="island-sheet" id="island-sheet" hidden></div>
  <div class="island-plant" id="island-plant" hidden></div>
  <div class="island-modal" id="island-modal" hidden></div>
  <p class="island-toast" id="island-toast" hidden></p>

  <script src="/static/site-key.js?v=island-back2"></script>
  <script src="/static/island/boot.js?v=island-back2"></script>
  <script type="module" src="/static/island/app.js?v=island-back2"></script>
  <script nomodule>
    var hint = document.getElementById("island-gate-hint");
    if (hint) hint.textContent = "这台浏览器跑不了完整地图。换系统浏览器，或去上手页。";
  </script>
</body>
</html>
