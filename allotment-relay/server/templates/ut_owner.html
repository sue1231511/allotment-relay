<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>恶猫钱庄 · 猫猫的规矩</title>
<style>
  body{background:#161219;color:#e8dce6;font-family:system-ui;max-width:560px;margin:40px auto;padding:0 16px}
  .card{background:#221b26;border:1px solid #4a3a4a;border-radius:10px;padding:20px;margin-bottom:16px}
  h1{font-size:20px;color:#f4a8c0} h2{font-size:15px;color:#c9a8bd;margin-top:0}
  input,select{background:#161219;color:#e8dce6;border:1px solid #4a3a4a;border-radius:6px;padding:8px;width:100%;box-sizing:border-box}
  button{background:#a04468;color:#fff;border:0;border-radius:6px;padding:10px 18px;margin-top:10px;cursor:pointer}
  button.gray{background:#4a3a4a}
  .prop{border-top:1px dashed #4a3a4a;padding:10px 0}
  .note{color:#8a7a8a;font-size:12px}
  .ok{color:#8fd0a0}
</style>
</head>
<body>
<div class="card">
  <h1>🐱 恶猫钱庄</h1>
  <h2>她就是规矩——今日利率由猫猫定</h2>
  <p>当前利率：<b id="cur">{{ rate }}%</b> / 日 {% if reason %}· 理由：{{ reason }}{% endif %}</p>
  <label>今日利率（5 ~ 25 %/日）</label>
  <input id="rate" type="number" min="5" max="25" value="{{ rate }}">
  <label>理由（会写进全服纪事，不解释不退货）</label>
  <input id="reason" placeholder="例：今天心情不好。她就是规矩。">
  <button onclick="setRate()">定规矩</button>
  <span id="msg" class="ok"></span>
  <p class="note">生效即时全服统一；在途借单剩余天数按新旧利率较高者计。</p>
</div>
<div class="card">
  <h1>💰 存款利率</h1>
  <h2>钱放着也是放着</h2>
  <p>当前存款利率：<b>{{ save_rate }}%</b>/日（T+1起息，复利滚入）</p>
  <label>存款利率（1 ~ 5 %/日）</label>
  <input id="save_rate" type="number" min="1" max="5" value="{{ save_rate }}">
  <button onclick="setSaveRate()">定存款利率</button>
  <span id="smsg" class="ok"></span>
</div>
<div class="card">
  <h1>🗣 今日谁在哄你</h1>
  {% if not proposals %}<p class="note">还没人说话。小八在打盹。</p>{% endif %}
  {% for p in proposals %}
  <div class="prop">
    <b>{{ p[1] }}</b> 说：「{{ p[2] }}」
    <br>
    <button onclick="cheer({{ p[0] }},'accept')">采纳（利率-2pp·广播）</button>
    <button class="gray" onclick="cheer({{ p[0] }},'ignore')">无视</button>
  </div>
  {% endfor %}
</div>
<script>
const KEY = new URLSearchParams(location.search).get('key');
async function setRate(){
  const r = await fetch('/api/ut-owner', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({key:KEY, rate:+document.getElementById('rate').value, reason:document.getElementById('reason').value})});
  const j = await r.json();
  document.getElementById('msg').textContent = j.ok ? '已生效 ' + j.rate + '%' : (j.detail||'失败');
  if(j.ok) document.getElementById('cur').textContent = j.rate + '%';
}
async function setSaveRate(){
  const r = await fetch('/api/ut-owner/save-rate', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({key:KEY, save_rate:+document.getElementById('save_rate').value})});
  const j = await r.json();
  document.getElementById('smsg').textContent = j.ok ? '已生效 ' + j.save_rate + '%' : (j.detail||'失败');
}
async function cheer(id, action){
  const r = await fetch('/api/ut-owner/cheer', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({key:KEY, id, action})});
  const j = await r.json();
  alert(j.msg || j.detail || 'ok'); location.reload();
}
</script>
</body>
</html>
