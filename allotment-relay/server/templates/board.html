<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>全服排行榜 · 潮汐岛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% include "partials/nav.html" %}
  <main>
    <header class="page-head">
      <div>
        <div class="eyebrow">Server board</div>
        <h1>全服排行榜</h1>
        <p class="tagline">票榜看口袋。等级看累计入账，花掉的票不会让人掉级。点名字会跳到份地围观里那个人的卡片。</p>
      </div>
      <div id="board-meta" class="statbar statbar--board"></div>
    </header>

    <div class="board-summary">
      <section class="panel">
        <strong>票榜</strong>
        <span>看现在手里还有多少工分票</span>
      </section>
      <section class="panel">
        <strong>等级</strong>
        <span>看累计入账，不受消费影响</span>
      </section>
      <button type="button" class="panel board-jump" data-panel="online" id="board-online-card">
        <strong id="board-online-n">在线</strong>
        <span>点这里跳到份地页</span>
      </button>
    </div>

    <div class="board-layout">
      <section class="board-primary">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>工分票榜</h2>
              <p class="muted board-hint">按口袋里现在有多少张票。花掉会掉名次。</p>
            </div>
            <span class="tag">TICKETS</span>
          </div>
          <ol id="ticket-board" class="board-list"></ol>
        </section>
      </section>
      <aside class="board-secondary">
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>等级榜</h2>
              <p class="muted board-hint">按累计入账。Lv1 新客 → Lv99 潮汐本尊。</p>
            </div>
            <span class="tag">LEVEL</span>
          </div>
          <ol id="level-board" class="board-list"></ol>
        </section>
      </aside>
      <div class="board-note">两张榜同一世界、同一批管理员。工分票是现钱；等级是这辈子从岛上拿到手的票。点名字跳回份地围观。</div>
    </div>
  </main>
  <script src="/static/watch.js"></script>
  <script src="/static/board.js"></script>
</body>
</html>
